<svg xmlns="http://www.w3.org/2000/svg" width="470" height="176" viewBox="0 0 470 176" role="img" aria-label="hamming-twin"><title>hamming-twin</title><defs><linearGradient id="glight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f9d78"/><stop offset="1" stop-color="#6248d8"/></linearGradient><radialGradient id="hlight" cx="0" cy="0" r="1"><stop offset="0" stop-color="#0f9d78" stop-opacity="0.18"/><stop offset="1" stop-color="#0f9d78" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="469" height="175" rx="14" fill="#ffffff" stroke="#d5dbe1"/><rect x="1" y="1" width="468" height="174" rx="13" fill="url(#hlight)"/><rect x="18" y="22" width="3" height="17" rx="1.5" fill="url(#glight)"/><text x="32" y="36" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1f2328">hamming-twin</text><text x="18" y="62" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#59636e">A digital twin of Richard Hamming. Answers in his voice,</text><text x="18" y="79" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#59636e">grounded in his own papers and talks, and remembers what</text><text x="18" y="96" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#59636e">you tell it within and across conversations.</text><rect x="18" y="124" width="47" height="19" rx="9.5" fill="none" stroke="#d5dbe1"/><text x="42" y="138" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#59636e">agents</text><rect x="72" y="124" width="28" height="19" rx="9.5" fill="none" stroke="#d5dbe1"/><text x="86" y="138" text-anchor="middle" font-family="ui-monospace,'SFMono-Regula