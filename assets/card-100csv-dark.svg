<svg xmlns="http://www.w3.org/2000/svg" width="470" height="176" viewBox="0 0 470 176" role="img" aria-label="100csv"><title>100csv</title><defs><linearGradient id="gdark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4a7"/><stop offset="1" stop-color="#8b7cff"/></linearGradient><radialGradient id="hdark" cx="0" cy="0" r="1"><stop offset="0" stop-color="#2dd4a7" stop-opacity="0.18"/><stop offset="1" stop-color="#2dd4a7" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="469" height="175" rx="14" fill="#0d1117" stroke="#232a33"/><rect x="1" y="1" width="468" height="174" rx="13" fill="url(#hdark)"/><rect x="18" y="22" width="3" height="17" rx="1.5" fill="url(#gdark)"/><text x="32" y="36" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#e6edf3">100csv</text><text x="18" y="62" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">Ranks 100 candidates out of 100,000 offline on CPU in</text><text x="18" y="79" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">under five minutes. BM25 + dense retrieval fused by RRF,</text><text x="18" y="96" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">cross-encoder rerank, Isolation Forest integrity gate. No</text><text x="18" y="113" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#8b949e">LLM in the decision.</text><rect x="18" y="124" width="67" height="19" rx="9.5" fill="none" stroke="#232a33"/><text x="51" y="138" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#8b949e">retrie