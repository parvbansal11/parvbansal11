name: refresh cards

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/projects.json"
      - "assets/skills.json"
      - "scripts/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Render cards and radars
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python scripts/cards.py
          python scripts/radar.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh generated cards"
          git push
